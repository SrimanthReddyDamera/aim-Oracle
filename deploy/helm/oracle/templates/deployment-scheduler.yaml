apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oracle.fullname" . }}-scheduler
  labels:
    {{- include "oracle.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  replicas: {{ .Values.scheduler.replicaCount }}
  selector:
    matchLabels:
      {{- include "oracle.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        {{- include "oracle.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: scheduler
    spec:
      serviceAccountName: {{ include "oracle.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 15
      containers:
        - name: scheduler
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/deploy/docker/entrypoint.sh", "scheduler"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "oracle.fullname" . }}-config
          env:
            - name: ORACLE_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "oracle.fullname" .)) .Values.database.existingSecret }}
                  key: {{ .Values.database.passwordKey }}
            - name: ORACLE_DATABASE_URL
              value: "postgresql://{{ .Values.database.user }}:$(ORACLE_DATABASE_PASSWORD)@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}?sslmode={{ .Values.database.sslMode }}"
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
