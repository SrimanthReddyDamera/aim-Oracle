apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oracle.fullname" . }}-api
  labels:
    {{- include "oracle.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  strategy:
    type: {{ .Values.api.strategy.type }}
    {{- if eq .Values.api.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ .Values.api.strategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.api.strategy.rollingUpdate.maxUnavailable }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "oracle.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "oracle.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "oracle.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/deploy/docker/entrypoint.sh", "api"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "oracle.fullname" . }}-config
          env:
            - name: ORACLE_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "oracle.fullname" .)) .Values.database.existingSecret }}
                  key: {{ .Values.database.passwordKey }}
            - name: ORACLE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "oracle.fullname" .)) .Values.webhook.existingSecret }}
                  key: {{ .Values.webhook.secretKey }}
            - name: ORACLE_DATABASE_URL
              value: "postgresql://{{ .Values.database.user }}:$(ORACLE_DATABASE_PASSWORD)@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}?sslmode={{ .Values.database.sslMode }}"
          livenessProbe:
            {{- toYaml .Values.api.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.api.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
