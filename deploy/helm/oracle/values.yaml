# =============================================================================
# Default values for ORACLE Helm Chart (Brick 4.6)
# =============================================================================

global:
  environment: production
  defaultTenant: default

image:
  repository: oracle/control-plane
  pullPolicy: IfNotPresent
  tag: "4.6.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: "oracle-sa"

rbac:
  create: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# --- Component: API Ingress ---
api:
  replicaCount: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 250m
      memory: 256Mi
  livenessProbe:
    httpGet:
      path: /health/live
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 15
  readinessProbe:
    httpGet:
      path: /health/ready
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 10

# --- Component: Distributed Workers ---
worker:
  replicaCount: 2
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 250m
      memory: 256Mi

# --- Component: Distributed Scheduler ---
scheduler:
  replicaCount: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# --- Ingress ---
ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: oracle.corp.internal
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: oracle-tls-cert
      hosts:
        - oracle.corp.internal

# --- Authoritative Database Configuration ---
database:
  backend: postgres
  host: "postgres.oracle.svc.cluster.local"
  port: 5432
  name: "oracle_production"
  user: "oracle_app"
  existingSecret: ""
  passwordKey: "database-password"
  sslMode: "require"

# --- Ephemeral Redis Coordination ---
redis:
  enabled: true
  host: "redis.oracle.svc.cluster.local"
  port: 6379
  existingSecret: ""
  passwordKey: "redis-password"

# --- Webhook Security ---
webhook:
  existingSecret: ""
  secretKey: "webhook-secret"
  maxDriftSeconds: 300
  maxPayloadBytes: 1048576

# --- Observability ---
observability:
  prometheusEnabled: true
  tracingEnabled: true
  otelEndpoint: "http://otel-collector.observability.svc.cluster.local:4318/v1/traces"
  sampleRate: 1.0

podDisruptionBudget:
  enabled: true
  minAvailable: 1
